name: Publicar sitio (babelquarto)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar paquetes de R
        shell: Rscript {0}
        run: |
          install.packages(
            c("babelquarto", "quarto", "servr"),
            repos = c("https://ropensci.r-universe.dev", "https://cloud.r-project.org")
          )

      - name: Renderizar sitio multilingüe
        shell: Rscript {0}
        run: |
          babelquarto::render_website(
            site_url = "https://ivan-barrera.github.io/pagina-personal/"
          )

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
